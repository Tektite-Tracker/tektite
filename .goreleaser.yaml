version: 2

project_name: tektite

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tektite
    binary: tektite
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "tektite_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 2
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^Merge pull request'

brews:
  - name: tektite
    homepage: https://github.com/tektite-tracker/tektite
    description: Git-like, local-first work tracking for humans and agents
    license: MIT
    repository:
      owner: tektite-tracker
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TOKEN }}"
    install: |
      bin.install "tektite"
      bin.install_symlink "tektite" => "tk"
    test: |
      system "#{bin}/tektite", "--version"
      assert_equal shell_output("#{bin}/tektite --version"), shell_output("#{bin}/tk --version")
