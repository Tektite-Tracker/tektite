version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - wrapcheck
    - revive
    - misspell
    - commentlint
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/tektite-tracker/tektite/internal/service
        - github.com/tektite-tracker/tektite/internal/mcp
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    custom:
      commentlint:
        type: module
        description: "comments must be directives, start with why:, or be name-first docblocks on exported declarations of public packages"
formatters:
  enable:
    - gofumpt
    - goimports
